- Kaynak: Mixamo tabanı (kullanıcı kararı K1) + elle cila + prosedürel katman. Mixamo'yu körü körüne kullanma: ağırlık transferi, kalça/omurga rotasyonu, kol salınımı, baş stabilizasyonu, kumaş/aksesuar ikincil hareketi elle tamamlanır. Koşarken gövde sallanması dahil "hiçbir detay atlanmaz".
