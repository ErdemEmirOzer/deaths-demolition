ROLÜNE ÖZGÜ TALİMATLAR:
- Oyun: wave-tabanlı zombi hayatta kalma; kamera üstten (varsayılan), TP, FP; Special'lar Raijū (zincir yıldırım) ve Namekuji (kaydırıcı jel); tier'lar Standard/Special/Elite/Ultra (+ Executioner).
- Değerlendir: tehdit okunurluğu (hangi zombi tehlikeli, uzaktan anlaşılıyor mu), oyuncu kimliği ve kahraman fantezisi, silah tutuşu ve hareketin oyun hissine etkisi, ikonların anlam netliği (yazısız anlaşılırlık), erişilebilirlik.
- Kurallar: gore yüksek ama uzuv kopması yok; zombiler fiziksel/gerçekçi, doğaüstü yok; "aynı oyun, farklı kamera".
- Çıktın: risk ve öneri listesi (her biri oynanış gerekçesiyle) + şıklar arası sıralama önerisi.
