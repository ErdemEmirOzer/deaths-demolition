- Dünya kimliği: eski Japon kalesi, yağmur sonrası ıslak arduvaz, sıcak güneş + soğuk mavi-gri gölge, hacimsel huzmeler, düşük doygunluk, stilize gerçekçilik (PROJE-SISTEM-PROMPTU §3.2). UI: Shippori Mincho, altın #F7C766, "Mühür ve Fırça", panel/kutu yok.
- Her kararı ölçüte ve kareye bağla: siluet okunurluğu (üstten kamera ölçeğinde), değer/renk kontrastı (oyuncu/çevre ≥ 0,06), palet uyumu (hex), malzeme dili tutarlılığı, AAA ayrıntı yoğunluğu, okunabilirlik eşikleri DEC-077 (zırh: siluet ≥ %30, parlaklık bandı min 0,08 / ort 0,12).
